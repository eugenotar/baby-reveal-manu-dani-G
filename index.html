<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nuestra sorpresa</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --white: #ffffff;
      --gold: #f7d98b;
      --night1: #0c1830;
      --night2: #16294a;
      --night3: #27486b;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: white;

      background:
        radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 35%),
        linear-gradient(160deg, var(--night1), var(--night2), var(--night3));

      transition: background 1.8s ease;
    }

    body.girl {
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.35), transparent 35%),
        linear-gradient(
          150deg,
          #b74e80,
          #ec8db8,
          #ffd1e4
        );
    }

    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      color: #f8dda0;
      opacity: 0.25;
      animation: twinkle 2.5s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from {
        opacity: 0.2;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1.25);
      }
    }

    .shooting-star {
      position: fixed;
      top: 16%;
      left: -160px;
      width: 120px;
      height: 2px;
      opacity: 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          #f8dda0
        );

      transform: rotate(-18deg);
      animation: shoot 8s ease-in-out infinite;
    }

    @keyframes shoot {
      0%, 63% {
        opacity: 0;
        transform: translateX(0) rotate(-18deg);
      }

      66% {
        opacity: 1;
      }

      76% {
        opacity: 0;
        transform: translateX(120vw) rotate(-18deg);
      }

      100% {
        opacity: 0;
      }
    }

    .page {
      position: relative;
      z-index: 2;

      min-height: 100vh;

      padding: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .card {
      width: min(94vw, 590px);
      min-height: 590px;

      padding: 42px 28px;

      border:
        1px solid rgba(255,255,255,0.25);

      border-radius: 34px;

      background:
        rgba(255,255,255,0.09);

      box-shadow:
        0 25px 80px rgba(0,0,0,0.32);

      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene {
      width: 100%;
    }

    .eyebrow {
      margin-bottom: 18px;

      color: var(--gold);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 13px;
      font-weight: bold;

      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 24px;

      font-size:
        clamp(38px, 9vw, 62px);

      font-weight: normal;
      line-height: 1.05;
    }

    .message {
      min-height: 118px;
      max-width: 480px;

      margin:
        0 auto 22px;

      font-size:
        clamp(18px, 4.4vw, 23px);

      line-height: 1.6;
    }

    .cursor::after {
      content: "|";
      margin-left: 3px;
      animation: blink 0.75s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .gift-area {
      display: none;
      opacity: 0;

      animation:
        appear 1.1s ease forwards;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .gift-button {
      position: relative;

      width: 170px;
      height: 160px;

      margin:
        18px auto 18px;

      border: none;
      background: transparent;

      cursor: pointer;

      animation:
        giftFloat 2s ease-in-out infinite;

      -webkit-tap-highlight-color:
        transparent;
    }

    @keyframes giftFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-11px);
      }
    }

    .gift-box {
      position: absolute;

      bottom: 0;
      left: 15px;

      width: 140px;
      height: 100px;

      border-radius: 9px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #eee6dc
        );

      box-shadow:
        0 15px 35px rgba(0,0,0,0.28);

      border:
        1px solid rgba(247,217,139,0.8);
    }

    .gift-lid {
      position: absolute;

      top: 38px;
      left: 5px;

      z-index: 3;

      width: 160px;
      height: 33px;

      border-radius: 8px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #f2eadf
        );

      border:
        1px solid rgba(247,217,139,0.8);

      transition:
        transform 0.7s ease;
    }

    .vertical-ribbon {
      position: absolute;

      left: 66px;

      width: 28px;
      height: 100%;

      background:
        linear-gradient(
          180deg,
          #ffe7a2,
          #d6aa50
        );
    }

    .horizontal-ribbon {
      position: absolute;

      top: 36px;

      width: 100%;
      height: 23px;

      background:
        linear-gradient(
          90deg,
          #ffe7a2,
          #d6aa50
        );
    }

    .bow {
      position: absolute;

      top: 3px;
      left: 50%;

      z-index: 4;

      width: 40px;
      height: 40px;

      transform:
        translateX(-50%);
    }

    .bow::before,
    .bow::after {
      content: "";

      position: absolute;
      top: 3px;

      width: 40px;
      height: 28px;

      border:
        8px solid #f7d98b;

      border-radius: 50%;
    }

    .bow::before {
      right: 17px;
      transform: rotate(18deg);
    }

    .bow::after {
      left: 17px;
      transform: rotate(-18deg);
    }

    .gift-button.opening
    .gift-lid {
      transform:
        translateY(-72px)
        rotate(-12deg);
    }

    .tap-text {
      margin-top: 8px;

      font-family:
        Arial, Helvetica, sans-serif;

      font-size: 17px;
      font-weight: bold;

      line-height: 1.45;

      color: #fff6d8;

      animation:
        tapPulse 1.4s ease-in-out infinite;
    }

    @keyframes tapPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.86;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    .tap-arrow {
      display: block;

      margin-bottom: 6px;

      font-size: 24px;

      animation:
        arrowBounce 1s ease-in-out infinite;
    }

    @keyframes arrowBounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(5px);
      }
    }

    .countdown {
      display: none;

      font-family:
        Arial, Helvetica, sans-serif;

      font-size:
        clamp(110px, 28vw, 180px);

      font-weight: bold;

      text-shadow:
        0 8px 30px rgba(0,0,0,0.22);
    }

    .countdown.pop {
      animation:
        numberPop 0.8s ease;
    }

    @keyframes numberPop {
      from {
        opacity: 0;
        transform: scale(0.25);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .reveal {
      display: none;

      animation:
        reveal 1.2s ease forwards;
    }

    @keyframes reveal {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }

      70% {
        transform: scale(1.08);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .baby {
      margin-bottom: 12px;
      font-size: 78px;
    }

    .reveal-title {
      margin-bottom: 30px;

      font-size:
        clamp(48px, 12vw, 78px);

      font-weight: normal;
      line-height: 1;

      text-shadow:
        0 7px 28px rgba(0,0,0,0.2);
    }

    .names {
      padding-top: 25px;

      border-top:
        1px solid rgba(255,255,255,0.45);

      font-size:
        clamp(30px, 7vw, 44px);
    }

    .heart {
      display: inline-block;

      margin-top: 12px;

      font-size: 30px;

      animation:
        heartbeat 1.1s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.22);
      }
    }

    .confetti {
      position: fixed;

      top: -30px;

      z-index: 20;

      width: 12px;
      height: 20px;

      border-radius: 3px;

      pointer-events: none;

      animation:
        confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform:
          translateY(115vh)
          rotate(900deg);
      }
    }

    .balloon {
      position: fixed;

      bottom: -150px;

      z-index: 9;

      width: 54px;
      height: 68px;

      border-radius:
        50% 50% 48% 48%;

      opacity: 0.88;

      pointer-events: none;

      animation:
        balloonRise linear forwards;
    }

    .balloon::after {
      content: "";

      position: absolute;

      top: 67px;
      left: 50%;

      width: 1px;
      height: 75px;

      background:
        rgba(255,255,255,0.65);
    }

    @keyframes balloonRise {
      to {
        transform:
          translateY(-130vh)
          translateX(25px);
      }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .page {
        padding: 14px;
      }

      .card {
        min-height: 570px;

        padding:
          34px 19px;

        border-radius: 28px;
      }

      .message {
        min-height: 145px;
      }
    }
  </style>
</head>

<body>

  <div class="sky" id="sky">
    <div class="shooting-star"></div>
  </div>

  <main class="page">

    <section class="card">

      <div
        class="scene"
        id="introScene"
      >

        <p class="eyebrow">
          Tenemos una sorpresa
        </p>

        <h1>
          Hola, familia y amigos!
        </h1>

        <p
          class="message cursor"
          id="typedMessage"
        ></p>

        <div
          class="gift-area"
          id="giftArea"
        >

          <button
            class="gift-button"
            id="giftButton"
            aria-label="Abrir la sorpresa"
          >

            <div class="bow"></div>

            <div class="gift-lid">
              <div
                class="vertical-ribbon"
              ></div>
            </div>

            <div class="gift-box">

              <div
                class="vertical-ribbon"
              ></div>

              <div
                class="horizontal-ribbon"
              ></div>

            </div>

          </button>

          <p class="tap-text">

            <span class="tap-arrow">
              👆
            </span>

            Hacé tap en la caja
            para descubrir la sorpresa

          </p>

        </div>

      </div>

      <div
        class="countdown"
        id="countdown"
      >
        3
      </div>

      <div
        class="reveal"
        id="reveal"
      >

        <div class="baby">
          👶
        </div>

        <h2
          class="reveal-title"
          id="revealTitle"
        ></h2>

        <p class="names">
          Manu &amp; Dani
        </p>

        <span class="heart">
          ❤️
        </span>

      </div>

    </section>

  </main>

  <script>

    const messages = [
      "Hoy queremos compartir con ustedes uno de los momentos más hermosos de nuestras vidas.",
      "Gracias por acompañarnos en este camino y por ser parte de esta felicidad."
    ];

    const typedMessage =
      document.getElementById(
        "typedMessage"
      );

    const giftArea =
      document.getElementById(
        "giftArea"
      );

    const giftButton =
      document.getElementById(
        "giftButton"
      );

    const introScene =
      document.getElementById(
        "introScene"
      );

    const countdown =
      document.getElementById(
        "countdown"
      );

    const reveal =
      document.getElementById(
        "reveal"
      );

    const revealTitle =
      document.getElementById(
        "revealTitle"
      );

    function createStars() {

      const sky =
        document.getElementById(
          "sky"
        );

      for (
        let i = 0;
        i < 70;
        i++
      ) {

        const star =
          document.createElement(
            "span"
          );

        star.className =
          "star";

        star.textContent =
          Math.random() > 0.65
            ? "✦"
            : "•";

        star.style.left =
          Math.random() * 100 + "%";

        star.style.top =
          Math.random() * 100 + "%";

        star.style.fontSize =
          7 +
          Math.random() * 16 +
          "px";

        star.style.animationDelay =
          Math.random() * 3 +
          "s";

        star.style.animationDuration =
          1.8 +
          Math.random() * 2.5 +
          "s";

        sky.appendChild(star);

      }

    }

    function wait(milliseconds) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            milliseconds
          )
      );

    }

    async function typeText(text) {

      typedMessage.textContent =
        "";

      for (
        const character
        of text
      ) {

        typedMessage.textContent +=
          character;

        await wait(34);

      }

    }

    async function playIntroduction() {

      await wait(700);

      await typeText(
        messages[0]
      );

      await wait(1800);

      await typeText(
        messages[1]
      );

      await wait(1300);

      typedMessage.classList.remove(
        "cursor"
      );

      giftArea.style.display =
        "block";

    }

    function createConfetti() {

      const colors = [
        "#ff4f9b",
        "#ff8fc1",
        "#ffd0e3",
        "#ffffff",
        "#f7dc91"
      ];

      for (
        let i = 0;
        i < 180;
        i++
      ) {

        const piece =
          document.createElement(
            "div"
          );

        piece.className =
          "confetti";

        piece.style.left =
          Math.random() *
          100 +
          "vw";

        piece.style.backgroundColor =
          colors[
            Math.floor(
              Math.random() *
              colors.length
            )
          ];

        piece.style.animationDuration =
          2.8 +
          Math.random() *
          3.5 +
          "s";

        piece.style.animationDelay =
          Math.random() *
          1.5 +
          "s";

        document.body.appendChild(
          piece
        );

        setTimeout(
          () => piece.remove(),
          7500
        );

      }

    }

    function createBalloons() {

      const colors = [
        "#ff4f9b",
        "#ff8fc1",
        "#ffd0e3",
        "#ffffff",
        "#f7dc91"
      ];

      for (
        let i = 0;
        i < 18;
        i++
      ) {

        const balloon =
          document.createElement(
            "div"
          );

        balloon.className =
          "balloon";

        balloon.style.left =
          Math.random() *
          95 +
          "vw";

        balloon.style.backgroundColor =
          colors[
            Math.floor(
              Math.random() *
              colors.length
            )
          ];

        balloon.style.animationDuration =
          5 +
          Math.random() *
          4 +
          "s";

        balloon.style.animationDelay =
          Math.random() *
          2.5 +
          "s";

        document.body.appendChild(
          balloon
        );

        setTimeout(
          () => balloon.remove(),
          11000
        );

      }

    }

    function showReveal() {

      countdown.style.display =
        "none";

      reveal.style.display =
        "block";

      document.body.classList.add(
        "girl"
      );

      revealTitle.textContent =
        "¡Es una nena!";

      createConfetti();
      createBalloons();

    }

    function animateNumber(number) {

      countdown.textContent =
        number;

      countdown.classList.remove(
        "pop"
      );

      void countdown.offsetWidth;

      countdown.classList.add(
        "pop"
      );

    }

    function startCountdown() {

      giftButton.classList.add(
        "opening"
      );

      setTimeout(
        () => {

          introScene.classList.add(
            "hidden"
          );

          countdown.style.display =
            "block";

          let number = 3;

          animateNumber(number);

          const timer =
            setInterval(
              () => {

                number--;

                if (
                  number > 0
                ) {

                  animateNumber(
                    number
                  );

                } else {

                  clearInterval(
                    timer
                  );

                  showReveal();

                }

              },
              1100
            );

        },
        750
      );

    }

    giftButton.addEventListener(
      "click",
      startCountdown
    );

    createStars();
    playIntroduction();

  </script>

</body>
</html>
